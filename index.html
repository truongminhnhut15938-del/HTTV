<!DOCTYPE html>
<html lang="vi">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HTTV - Hệ Thống Tri Thức Văn Bản</title>

<link rel="stylesheet" href="frontend/css/style.css">

</head>


<body>


<header>

<h1>📚 HTTV</h1>

<p>Hệ Thống Tri Thức Văn Bản</p>

</header>



<main>


<section class="search-box">

<input 
id="searchInput"
type="text"
placeholder="Nhập từ khóa hoặc câu hỏi..."
>


<button id="btnSearch">
🔍 Tra cứu
</button>


</section>



<section class="menu"><button id="btnUpload">
📂 Thêm tài liệu
</button><input
id="fileInput"
type="file"
hidden
accept=".pdf,.doc,.docx,.xls,.xlsx,.txt">

<button id="btnDocuments">
📄 Danh sách tài liệu
</button><button id="btnKnowledge">
🧠 Kho tri thức
</button><button id="btnSettings">
⚙️ Cài đặt
</button></section>



<section class="reader-box">


<h3>
📄 Nội dung tài liệu
</h3>


<div 
id="documentContent"
style="
border:1px solid #ccc;
padding:10px;
height:350px;
overflow:auto;
background:#fff;
"
>

Nội dung tài liệu sẽ hiển thị tại đây

</div>


</section>



<section class="result-box">


<h3>
🔎 Kết quả tra cứu
</h3>


<div id="searchResult">

Chưa có kết quả

</div>


</section>



</main>



<footer>


<p>
HTTV © 2026 - Hệ Thống Tri Thức Văn Bản
</p>


</footer>





<!-- Thư viện đọc PDF -->

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>



<!-- Thư viện đọc DOCX -->

<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<!-- Các module HTTV -->


<script src="frontend/js/config.js"></script>
  
<script src="frontend/js/database.js"></script>

<script src="frontend/js/reader.js"></script>

<script src="frontend/js/ui.js"></script>

<script src="frontend/js/app.js"></script>



</body>

</html>
