<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HTTV - Hệ Thống Tri Thức Văn Bản</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f6fa;
            color: #222;
        }

        header {
            background: #0f62fe;
            color: white;
            padding: 16px;
        }

        header h1 {
            margin: 0;
            font-size: 22px;
        }

        header p {
            margin: 6px 0 0;
            font-size: 14px;
            opacity: 0.9;
        }

        .container {
            padding: 16px;
        }

        .toolbar {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 16px;
        }

        button {
            background: #0f62fe;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 12px 16px;
            font-size: 15px;
            cursor: pointer;
        }

        button:hover {
            background: #0353e9;
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 16px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.08);
        }

        .card h2 {
            margin-top: 0;
            font-size: 18px;
        }

        #documentList {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .doc-item {
            border: 1px solid #ddd;
            border-radius: 10px;
            padding: 12px;
            cursor: pointer;
            background: #fafafa;
        }

        .doc-item:hover {
            background: #f0f4ff;
            border-color: #0f62fe;
        }

        .doc-name {
            font-weight: bold;
            margin-bottom: 4px;
        }

        .doc-meta {
            font-size: 13px;
            color: #666;
        }

        .meta-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px;
        }

        .meta-row {
            border-bottom: 1px solid #eee;
            padding-bottom: 8px;
        }

        .meta-label {
            font-size: 13px;
            color: #777;
            margin-bottom: 2px;
        }

        .meta-value {
            font-weight: bold;
        }

        #documentContent {
            white-space: pre-wrap;
            line-height: 1.6;
            font-size: 15px;
            max-height: 420px;
            overflow-y: auto;
        }

        #reader-status {
            padding: 12px;
            border-radius: 8px;
            background: #eef4ff;
            color: #0f62fe;
            margin-bottom: 16px;
            display: none;
        }
    </style>
</head>

<body>

<header>
    <h1>📚 HTTV - Hệ Thống Tri Thức Văn Bản</h1>
    <p>Kho lưu trữ và phân tích PDF / DOCX (Offline)</p>
</header>

<div class="container">

    <div id="reader-status"></div>

    <div class="toolbar">
        <button id="btnUpload">📂 Thêm tài liệu</button>

        <input
            type="file"
            id="fileInput"
            accept=".pdf,.docx"
            hidden
        />
    </div>

    <div class="card">
        <h2>📁 Danh sách tài liệu</h2>

        <div id="documentList">
            Chưa có tài liệu nào.
        </div>
    </div>

    <div class="card">
        <h2>📄 Thông tin tài liệu</h2>

        <div class="meta-grid">

            <div class="meta-row">
                <div class="meta-label">Loại văn bản</div>
                <div class="meta-value" id="metaType">-</div>
            </div>

            <div class="meta-row">
                <div class="meta-label">Số hiệu</div>
                <div class="meta-value" id="metaNumber">-</div>
            </div>

            <div class="meta-row">
                <div class="meta-label">Cơ quan ban hành</div>
                <div class="meta-value" id="metaAgency">-</div>
            </div>

            <div class="meta-row">
                <div class="meta-label">Ngày ban hành</div>
                <div class="meta-value" id="metaIssueDate">-</div>
            </div>

            <div class="meta-row">
                <div class="meta-label">Ngày hiệu lực</div>
                <div class="meta-value" id="metaEffectiveDate">-</div>
            </div>

            <div class="meta-row">
                <div class="meta-label">Trạng thái</div>
                <div class="meta-value" id="metaStatus">-</div>
            </div>

        </div>
    </div>

    <div class="card">
        <h2>📝 Nội dung tài liệu</h2>

        <div id="documentContent">
            Chọn một tài liệu để xem nội dung.
        </div>
    </div>

</div>

<!-- ===========================
     THƯ VIỆN CỤC BỘ (OFFLINE)
=========================== -->

<!-- PDF.js -->
<script src="lib/pdf.min.js"></script>
<script>
pdfjsLib.GlobalWorkerOptions.workerSrc = "lib/pdf.worker.min.js";
</script>

<!-- Mammoth đọc DOCX -->
<script src="lib/mammoth.browser.min.js"></script>

<!-- ===========================
     MODULE HTTV
=========================== -->

<script src="js/db.js"></script>
<script src="js/parser.js"></script>

<script>
    // ===========================
    // HIỂN THỊ TRẠNG THÁI
    // ===========================
    function showStatus(message) {
        const box = document.getElementById("reader-status");
        box.style.display = "block";
        box.textContent = message;
    }

    function hideStatus() {
        document.getElementById("reader-status").style.display = "none";
    }

    // ===========================
    // THÊM TÀI LIỆU (HTTV Offline)
    // ===========================
    const btnUpload = document.getElementById("btnUpload");
    const fileInput = document.getElementById("fileInput");
    const libraryList = document.getElementById("libraryList");

         btnUpload.addEventListener("click", () => {
         fileInput.click();
});

fileInput.addEventListener("change", async (e) => {
    const file = e.target.files[0];
    if (!file) return;

    if (
        !file.name.toLowerCase().endsWith(".pdf") &&
        !file.name.toLowerCase().endsWith(".docx")
    ) {
        alert("Chỉ hỗ trợ PDF và DOCX");
        return;
    }

    try {
        btnUpload.disabled = true;
        btnUpload.textContent = "Đang phân tích...";

        const doc = await parseDocument(file);

        addDocument(doc);

        renderLibrary();

        alert("Đã thêm tài liệu: " + file.name);

    } catch (err) {
        console.error(err);
        alert("Lỗi khi đọc tài liệu: " + err.message);
    } finally {
        btnUpload.disabled = false;
        btnUpload.textContent = "Thêm tài liệu";
        fileInput.value = "";
    }
});

function renderLibrary() {
    const docs = loadDocuments();

    if (!docs.length) {
        libraryList.innerHTML =
            '<p class="empty">Chưa có tài liệu nào.</p>';
        return;
    }

    libraryList.innerHTML = docs.map(doc => `
        <div class="doc-item">
            <h3>${doc.name}</h3>

            <p><b>Số văn bản:</b>
                ${doc.metadata.documentNumber || "Chưa xác định"}
            </p>

            <p><b>Ngày ban hành:</b>
                ${doc.metadata.issuedDate || "Chưa xác định"}
            </p>

            <p><b>Ngày hiệu lực:</b>
                ${doc.metadata.effectiveDate || "Chưa xác định"}
            </p>

            <p><b>Điều khoản:</b>
                ${doc.clauses.length}
            </p>
        </div>
    `).join("");
}

// Hiển thị kho tài liệu khi mở HTTV
renderLibrary();


    // ===========================
    // DANH SÁCH TÀI LIỆU
    // ===========================
    async function loadDocumentList() {

        const list = document.getElementById("documentList");

        const docs = await getAllDocuments();

        if (!docs.length) {

            list.innerHTML = "Chưa có tài liệu nào.";

            return;

        }

        list.innerHTML = docs.map(doc => `
            <div class="doc-item" data-id="${doc.id}">
                <div class="doc-name">${doc.fileName}</div>
                <div class="doc-meta">
                    ${new Date(doc.createdAt).toLocaleString("vi-VN")}
                </div>
            </div>
        `).join("");

        list.querySelectorAll(".doc-item").forEach(item => {
            item.addEventListener("click", () => openDocument(item.dataset.id));
        });

    }

    // ===========================
    // MỞ TÀI LIỆU
    // ===========================
    async function openDocument(id) {

        const doc = await getDocumentById(id);

        if (!doc) return;

        document.getElementById("metaType").textContent =
            doc.metadata.docType || "-";

        document.getElementById("metaNumber").textContent =
            doc.metadata.number || "-";

        document.getElementById("metaAgency").textContent =
            doc.metadata.agency || "-";

        document.getElementById("metaIssueDate").textContent =
            doc.metadata.issuedDate || "-";

        document.getElementById("metaEffectiveDate").textContent =
            doc.metadata.effectiveDate || "-";

        document.getElementById("metaStatus").textContent =
            doc.metadata.status || "-";

        document.getElementById("documentContent").textContent =
            doc.rawText || "(Không có nội dung)";

    }

    // ===========================
    // KHỞI ĐỘNG HTTV
    // ===========================
    window.addEventListener("load", async () => {

        await initDatabase();

        await loadDocumentList();

    });

</script>
    <script src="lib/pdf.min.js"></script>
    <script src="lib/mammoth.browser.min.js"></script>
    <script src="js/parser.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
</body>
</html>
