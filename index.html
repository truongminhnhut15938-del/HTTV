<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>HTTV - Hệ Thống Tri Thức Văn Bản</title>

    <!-- PDF.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.5.136/pdf.min.js"></script>

    <!-- Mammoth (DOCX) -->
    <script src="https://unpkg.com/mammoth/mammoth.browser.min.js"></script>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f6fa;
            color: #222;
        }

        header {
            background: #0f62fe;
            color: white;
            padding: 16px;
        }

        header h1 {
            margin: 0;
            font-size: 22px;
        }

        header p {
            margin: 6px 0 0;
            font-size: 14px;
            opacity: 0.9;
        }

        .container {
            padding: 16px;
        }

        .toolbar {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 16px;
        }

        button {
            background: #0f62fe;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 12px 16px;
            font-size: 15px;
            cursor: pointer;
        }

        button:hover {
            background: #0353e9;
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 16px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.08);
        }

        .card h2 {
            margin-top: 0;
            font-size: 18px;
        }

        #documentList {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .doc-item {
            border: 1px solid #ddd;
            border-radius: 10px;
            padding: 12px;
            cursor: pointer;
            background: #fafafa;
        }

        .doc-item:hover {
            background: #f0f4ff;
            border-color: #0f62fe;
        }

        .doc-name {
            font-weight: bold;
            margin-bottom: 4px;
        }

        .doc-meta {
            font-size: 13px;
            color: #666;
        }

        .meta-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px;
        }

        .meta-row {
            border-bottom: 1px solid #eee;
            padding-bottom: 8px;
        }

        .meta-label {
            font-size: 13px;
            color: #777;
            margin-bottom: 2px;
        }

        .meta-value {
            font-weight: bold;
        }

        #documentContent {
            white-space: pre-wrap;
            line-height: 1.6;
            font-size: 15px;
            max-height: 420px;
            overflow-y: auto;
        }

        #reader-status {
            padding: 12px;
            border-radius: 8px;
            background: #eef4ff;
            color: #0f62fe;
            margin-bottom: 16px;
            display: none;
        }

    </style>
</head>

<body>

<header>
    <h1>📚 HTTV - Hệ Thống Tri Thức Văn Bản</h1>
    <p>Kho lưu trữ và phân tích PDF / DOCX</p>
</header>

<div class="container">

    <div id="reader-status"></div>

    <div class="toolbar">

        <button id="btnUpload">📂 Thêm tài liệu</button>

        <input
            type="file"
            id="fileInput"
            accept=".pdf,.docx"
            hidden
        />

    </div>

    <div class="card">

        <h2>📁 Danh sách tài liệu</h2>

        <div id="documentList">

            Chưa có tài liệu nào.

        </div>

    </div>

    <div class="card">

        <h2>📄 Thông tin tài liệu</h2>

        <div class="meta-grid">

            <div class="meta-row">
                <div class="meta-label">Loại văn bản</div>
                <div class="meta-value" id="metaType">-</div>
            </div>

            <div class="meta-row">
                <div class="meta-label">Số hiệu</div>
                <div class="meta-value" id="metaNumber">-</div>
            </div>

            <div class="meta-row">
                <div class="meta-label">Cơ quan ban hành</div>
                <div class="meta-value" id="metaAgency">-</div>
            </div>

            <div class="meta-row">
                <div class="meta-label">Ngày ban hành</div>
                <div class="meta-value" id="metaIssueDate">-</div>
            </div>

            <div class="meta-row">
                <div class="meta-label">Ngày hiệu lực</div>
                <div class="meta-value" id="metaEffectiveDate">-</div>
            </div>

            <div class="meta-row">
                <div class="meta-label">Trạng thái</div>
                <div class="meta-value" id="metaStatus">-</div>
            </div>

        </div>

    </div>

    <div class="card">

        <h2>📝 Nội dung tài liệu</h2>

        <div id="documentContent">

            Chọn một tài liệu để xem nội dung.

        </div>

    </div>

</div>

<script>

    pdfjsLib.GlobalWorkerOptions.workerSrc =
        "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.5.136/pdf.worker.min.js";

</script>

<script src="js/storage.js"></script>
<script src="js/reader.js"></script>

<script>

    document.getElementById("btnUpload").addEventListener("click", () => {
        document.getElementById("fileInput").click();
    });

    function showStatus(message) {

        const box = document.getElementById("reader-status");

        box.style.display = "block";

        box.textContent = message;

    }

    async function loadDocumentList() {

        const list = document.getElementById("documentList");

        const docs = await getAllDocuments();

        if (!docs.length) {

            list.innerHTML = "Chưa có tài liệu nào.";

            return;

        }

        list.innerHTML = docs.map(doc => `
            <div class="doc-item" onclick="openDocument('${doc.id}')">
                <div class="doc-name">${doc.fileName}</div>
                <div class="doc-meta">
                    ${(doc.fileSize / 1024).toFixed(1)} KB
                </div>
            </div>
        `).join("");

    }

    async function openDocument(id) {

        const doc = await getDocument(id);

        if (!doc) return;

        document.getElementById("metaType").textContent =
            doc.type || "-";

        document.getElementById("metaNumber").textContent =
            doc.number || "-";

        document.getElementById("metaAgency").textContent =
            doc.agency || "-";

        document.getElementById("metaIssueDate").textContent =
            doc.issueDate || "-";

        document.getElementById("metaEffectiveDate").textContent =
            doc.effectiveDate || "-";

        document.getElementById("metaStatus").textContent =
            doc.status || "-";

        document.getElementById("documentContent").textContent =
            doc.rawText || "(Không có nội dung)";

    }

    window.addEventListener("load", async () => {

        await initDB();

        await loadDocumentList();

    });

</script>

</body>
</html>
