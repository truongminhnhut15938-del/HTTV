<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>SỔ TAY VĂN BẢN</title>

  <!-- CSS -->
  <link rel="stylesheet" href="frontend/css/style.css">
</head>

<body>

<div class="app">

  <!-- ===========================
       HEADER
  ============================ -->
  <section class="search-section">
  <div class="search-bar">
    <input
      id="searchInput"
      type="text"
      placeholder="Tra cứu theo loại văn bản, số văn bản hoặc mô tả nội dung..."
    >

    <button id="btnSearch">
      🔍 Tra cứu
    </button>
  </div>
</section>

  <!-- ===========================
       ACTION BAR
  ============================ -->
  <section class="action-bar">

    <button id="btnUpload" class="btn primary">
      ➕ Thêm tài liệu
    </button>

    <input
      id="fileInput"
      type="file"
      accept=".pdf,.docx"
      style="display:none"
    >

  </section>

  <!-- ===========================
       MAIN LAYOUT
  ============================ -->
  <main class="main-layout">

    <!-- KHO TÀI LIỆU -->
    <aside class="library-panel">

      <div class="panel-title">
        📂 Kho tài liệu
      </div>

      <div id="libraryList" class="library-list">
        <p class="empty">Chưa có tài liệu nào.</p>
      </div>

    </aside>

    <!-- CHI TIẾT TÀI LIỆU -->
    <section class="detail-panel">

      <div class="panel-title">
        📄 Chi tiết tài liệu
      </div>

      <div id="detailView" class="detail-view">

        <div class="detail-card">

          <h2>Chưa chọn tài liệu</h2>

          <p>
            Hãy nhấn <b>➕ Thêm tài liệu</b> để nhập một file PDF hoặc DOCX.
          </p>

          <p>HTTV sẽ tự động phân tích:</p>

          <ul>
            <li>Số văn bản</li>
            <li>Ngày ban hành</li>
            <li>Ngày hiệu lực</li>
            <li>Các Điều khoản</li>
          </ul>

        </div>

      </div>

    </section>

  </main>

</div>

<!-- ===========================
     LIBRARIES
============================ -->

<!-- PDF.js -->
<script src="lib/pdf.min.js"></script>

<!-- Mammoth DOCX -->
<script src="lib/mammoth.browser.min.js"></script>

<!-- ===========================
     HTTV MODULES
============================ -->

<script src="frontend/js/storage.js"></script>
<script src="frontend/js/parser.js"></script>
<script src="frontend/js/app.js"></script>

</body>
</html>
