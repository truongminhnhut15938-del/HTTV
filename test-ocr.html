<!DOCTYPE html><html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HTTV OCR Test</title>
</head>
<body><h2>HTTV OCR Test</h2><input type="file" id="pdfFile" accept=".pdf">
<button id="btn">Đọc PDF</button><pre id="result"></pre><script>
document.getElementById('btn').onclick = async () => {

const file = document.getElementById('pdfFile').files[0];

if (!file) {
alert('Chưa chọn file');
return;
}

const result = document.getElementById('result');

result.textContent = 'Đang gửi...';

try {

const formData = new FormData();
formData.append('file', file);

const response = await fetch(
'https://httv-ocr-backend.onrender.com/ocr',
{
method: 'POST',
body: formData
}
);

result.textContent =
'HTTP: ' + response.status + '\\n';

const text = await response.text();

result.textContent += text;

} catch (e) {

result.textContent =
'FETCH ERROR: ' + e.message;

}

};
</script></body>
</html>
